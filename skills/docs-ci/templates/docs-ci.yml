# docs-ci.yml — 문서 검증 파이프라인 템플릿
# 프로젝트에 존재하는 문서 유형에 맞는 잡만 골라서 .github/workflows/docs-ci.yml로 설치
name: Docs CI

on:
  pull_request:
    paths: ["docs/**", "**/*.md", "src/**"]
  push:
    branches: [main]

jobs:
  links:
    name: 링크 체크
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 내부 링크 (깨지면 fail)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments 'docs/**/*.md' '*.md'
          fail: true
      - name: 외부 링크 (경고만)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress 'docs/**/*.md' '*.md'
          fail: true
        continue-on-error: true # 외부 사이트 플레이크는 막지 않는다

  openapi:
    name: OpenAPI lint + breaking
    runs-on: ubuntu-latest
    # job 레벨 if: hashFiles()는 checkout 전(빈 워크스페이스)에 평가돼 항상 skip — checkout 후 step에서 셸로 검사
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Lint
        run: |
          [ -f docs/api/openapi.yaml ] || { echo "openapi.yaml 없음 — skip"; exit 0; }
          npx --yes @redocly/cli lint docs/api/openapi.yaml
      - name: Breaking changes vs base
        if: github.event_name == 'pull_request'
        run: |
          [ -f docs/api/openapi.yaml ] || exit 0
          git show "origin/${{ github.base_ref }}:docs/api/openapi.yaml" > base-openapi.yaml 2>/dev/null || { echo "base에 명세 없음 — skip"; exit 0; }
          # npm의 oasdiff는 빈 placeholder 패키지다. 공식 Docker 이미지를 쓴다
          docker run --rm -v "$PWD:/w:ro" -w /w tufin/oasdiff breaking base-openapi.yaml docs/api/openapi.yaml --fail-on ERR

  mermaid:
    name: mermaid 문법 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate mermaid blocks
        run: |
          grep -rq --include='*.md' '```mermaid' docs 2>/dev/null || { echo "mermaid 블록 없음"; exit 0; }
          npm install -g @mermaid-js/mermaid-cli
          # mmdc는 .md 입력의 mermaid 블록을 모두 렌더한다. -o는 svg·png·pdf·md만 받는다(/dev/null 불가)
          out="$RUNNER_TEMP/mmd"; mkdir -p "$out"
          echo '{"args":["--no-sandbox"]}' > "$RUNNER_TEMP/puppeteer.json"
          fail=0; n=0
          while IFS= read -r -d '' f; do
            n=$((n+1))
            mmdc -p "$RUNNER_TEMP/puppeteer.json" -i "$f" -o "$out/$n.md" || { echo "::error file=$f::mermaid 렌더 실패"; fail=1; }
          done < <(grep -rl --null --include='*.md' '```mermaid' docs)
          exit $fail

  freshness:
    name: 문서 신선도
    runs-on: ubuntu-latest
    # job 레벨 if: hashFiles()는 checkout 전 평가로 항상 skip — checkout 후 step에서 셸로 검사
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Freshness check
        run: |
          [ -f docs/docs.yaml ] || { echo "docs.yaml 없음 — skip"; exit 0; }
          bash scripts/check-docs-freshness.sh docs/docs.yaml
        continue-on-error: true # stale = 경고. 강제하려면 제거

  doc-touch-policy:
    name: 코드-문서 동시 변경 정책
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: API 코드 변경 시 docs/api 변경 확인
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if echo "$CHANGED" | grep -qE '^(src/api/|src/routes/)' && ! echo "$CHANGED" | grep -q '^docs/api/'; then
            echo "::warning::API 코드가 변경됐지만 docs/api/ 가 갱신되지 않았습니다. /docs api 실행을 검토하세요."
          fi
